<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55b0a7" />
      <stop offset="50%" stop-color="#338b84" />
      <stop offset="100%" stop-color="#205753" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#skyGrad)" />

  <!-- Outer Sun Rays Ring -->
  <g stroke="url(#sunGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="80" x2="256" y2="114" />
    <line x1="256" y1="398" x2="256" y2="432" />
    <line x1="80" y1="256" x2="114" y2="256" />
    <line x1="398" y1="256" x2="432" y2="256" />
    <line x1="132" y1="132" x2="156" y2="156" />
    <line x1="356" y1="356" x2="380" y2="380" />
    <line x1="132" y1="380" x2="156" y2="356" />
    <line x1="356" y1="156" x2="380" y2="132" />
  </g>

  <!-- Glowing Sun Core -->
  <circle cx="256" cy="256" r="110" fill="url(#sunGrad)" filter="url(#glow)" />

  <!-- Tropical Palm Curve Silhouette -->
  <path d="M 220 340 Q 240 280 280 230 Q 320 200 360 210 Q 310 230 290 270 Q 270 310 250 340 Z" fill="#ffffff" opacity="0.3" />

  <!-- Dynamic Jet / Flight Silhouette -->
  <path d="M 180 280 L 260 240 L 330 220 L 350 215 L 340 235 L 305 255 L 300 290 L 285 275 L 265 285 L 255 315 L 240 315 L 245 285 L 205 295 Z" fill="#ffffff" />
</svg>
